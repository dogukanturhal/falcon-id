# falcon-id migration -> Keystone release-vehicle lock (bundled.lock)
# -----------------------------------------------------------------------------
# Source of truth for "which internal/migrations/000N_*.sql has a RELEASED
# Keystone bundle (or baseline)". Enforced by `go run ./hack/bundle-lock-check`
# (CI stage `lint`, allow_failure:false) and consumed by the PR-time schema-gap
# test. See internal/migrations/bundlelock and docs/adr/0001-keystone-migration-bundle-deploy-ordering.md.
#
# WHY: falcon-id migrations are applied in prod by the Keystone MigrationBundle
# operator in the SEPARATE the GitOps repository repo, NOT by pkg/database.Migrator.
# The 2026-07-21 P1 SSO outage happened because migration 0009 shipped with code
# that wrote iam_oauth_tokens.token_family_id, but no bundle was ever rendered,
# so the column never got added and every /oauth/token exchange 400'd. This lock
# makes the migration<->bundle mapping visible to falcon-id CI so a migration can
# never merge without its released bundle being recorded here.
#
# DISCIPLINE — when you add a migration internal/migrations/000N_<name>.sql:
#   1. Render + MERGE its Keystone MigrationBundle in the GitOps repository
#      (platform/keystone/resources/falcon-id/migration-bundles/falcon-id-v0.232.NNN.yaml)
#      and let the operator APPLY it (deploy-ordering gate: schema before code).
#   2. Add a line below: <file>  <bundle-version|baseline>  <sha256-of-file>
#      Compute the digest with:  sha256sum internal/migrations/000N_<name>.sql
#   3. CI `bundle-lock-check` fails until both the entry and the file agree.
#
# FORMAT:  <migration-file>  <vehicle>  <sha256-hex>
#   vehicle = released bundle version "v0.232.NNN"  OR  "baseline" (DDL folded
#             into the Keystone SchemaDefinition schema-definition-main.yaml).
# NOTE: NNN is Keystone's monotonic bundle counter, independent of the migration
#       number (0006->258, 0007->259, 0008->261, 0009->262). There is no on-disk
#       0006 migration.
# t-500 (2026-09-05): bundle 255 originally carried BOTH 0001 and 0002. Only
# 0001 was ever actually applied to prod (hot-patched 2026-06-03); 0002 was
# incorrectly recorded as applied alongside it because Keystone's ledger keys
# on bundle version alone, not per-file. iam_team_invitations did not exist
# live. 0002 is re-vehicled to its own bundle, v0.232.264, which Keystone
# will dispatch as a genuinely new (non-AlreadyApplied) execution.
# -----------------------------------------------------------------------------
