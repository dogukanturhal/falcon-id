# HexxLock Platform Service Registry
#
# This file is the single source of truth for all services monitored by the
# platform health endpoint. It is embedded into the Falcon-ID binary via go:embed.
#
# To add a new service:
#   1. Add an entry below with the correct docker-compose service name as hostname
#   2. Rebuild Falcon-ID
#
# For K8s deployments, override with SERVICE_REGISTRY_PATH env var pointing to
# a ConfigMap-mounted YAML with environment-specific hostnames.
#
# check_type: "http" (default) or "tcp" for non-HTTP services
# category: platform | business | infrastructure | frontend | monitoring

services:
