{{- if .Values.linkerd.policy.enabled }}
{{- $nsList := default (list) .Values.linkerd.policy.allowedNamespaces -}}
{{- $saList := default (list) .Values.linkerd.policy.allowedServiceAccounts -}}
{{- $idList := default (list) .Values.linkerd.policy.allowedIdentities -}}
{{- if and (empty $nsList) (empty $saList) (empty $idList) -}}
{{- fail "linkerd.policy.enabled=true requires at least one of allowedNamespaces, allowedServiceAccounts, or allowedIdentities to be non-empty" -}}
{{- end -}}
---
# MeshTLSAuthentication — the set of workload identities that the
# AuthorizationPolicy accepts for falcon-id.
#
# Uses spec.identities (NOT identityRefs) because:
#   1. identityRefs[*].kind: Namespace is silently ignored by Linkerd
#      edge-26.5.1 — verified 2026-05-09 by direct proxy-log
#      inspection (defectdojo.monitoring matched authz.kind=default
#      authz.name=audit despite cnpg-allow-monitoring-ns AuthZ).
#      See operational notes.
#      Linkerd docs at https://linkerd.io/2-edge/reference/authorization-policy/
#      confirm identityRefs supports ONLY kind: ServiceAccount.
#   2. spec.identities accepts SPIFFE patterns including the namespace
#      wildcard `*.<ns>.serviceaccount.identity.linkerd.cluster.local`
#      that maps cleanly to allowedNamespaces values.
#   3. Single-branch emission avoids the CRD oneOf constraint.
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: {{ include "falcon-id.fullname" . }}-allowed-callers-ns
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon-id.labels" . | nindent 4 }}
spec:
  identities:
    {{- range $nsList }}
    - {{ printf "*.%s.serviceaccount.identity.linkerd.cluster.local" . | quote }}
    {{- end }}
    {{- range $saList }}
    - {{ printf "%s.%s.serviceaccount.identity.linkerd.cluster.local" .name .namespace | quote }}
    {{- end }}
    {{- range $idList }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
