{{- if .Values.externalSecrets.enabled }}
{{/*
  Single ExternalSecret that projects all four Vault KV paths
  (main DB, control DB, app secrets, spicedb PSK) into a unified
  Kubernetes Secret named <fullname>-vault. Pod consumes via envFrom,
  which exposes every key as an env var.

  Vault KV properties → env var mapping:
    database-main:   host, port, db, user, password → FALCON_DB_*
    database-control: same → FALCON_DB_CONTROL_*
    platform/falcon-id/app: jwt_secret, encryption_key, token_hash_salt,
      internal_api_key, email_hash_key → JWT_SECRET, ENCRYPTION_KEY,
      TOKEN_HASH_SALT, INTERNAL_API_KEY, EMAIL_HASH_KEY
    platform/spicedb/psk: presharedkey → SPICEDB_PRESHARED_KEY

  A target.template synthesizes DATABASE_URL and CONTROL_PLANE_DATABASE_URL
  as DSN strings from the individual host/port/db/user/password fields
  because the PushSecret writes them as separate fields, not as a ready
  DSN.
*/}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "falcon-id.fullname" . }}-vault
  labels:
    {{- include "falcon-id.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "falcon-id.fullname" . }}-vault
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Main DB DSN — composed from individual fields
        DATABASE_URL: "postgres://{{ `{{ .main_user }}` }}:{{ `{{ .main_password }}` }}@{{ `{{ .main_host }}` }}:{{ `{{ .main_port }}` }}/{{ `{{ .main_db }}` }}?sslmode=require"
        # Control-plane DB DSN
        CONTROL_PLANE_DATABASE_URL: "postgres://{{ `{{ .ctl_user }}` }}:{{ `{{ .ctl_password }}` }}@{{ `{{ .ctl_host }}` }}:{{ `{{ .ctl_port }}` }}/{{ `{{ .ctl_db }}` }}?sslmode=require"
        # Redis URL (password-less, cluster-internal)
        REDIS_URL: "redis://{{ .Values.env.REDIS_HOST }}:{{ .Values.env.REDIS_PORT }}/0"
        # App secrets — passthrough
        JWT_SECRET: "{{ `{{ .jwt_secret }}` }}"
        ENCRYPTION_KEY: "{{ `{{ .encryption_key }}` }}"
        TOKEN_HASH_SALT: "{{ `{{ .token_hash_salt }}` }}"
        INTERNAL_API_KEY: "{{ `{{ .internal_api_key }}` }}"
        # HMAC key for user-email-hash lookup column. Wired to
        # repositories.SetEmailHashKey at startup; pods fail-fast
        # via RequireEmailHashKey if missing. See
        # internal/repositories/user_repository.go for the rationale
        # and the 2026-05-22 incident memo for the corruption that
        # prompted the fail-fast.
        EMAIL_HASH_KEY: "{{ `{{ .email_hash_key }}` }}"
        # SpiceDB — falcon-id's config loader reads SPICEDB_TOKEN
        # (pkg/config/config.go: SpiceDBToken mapstructure tag).
        # The legacy name SPICEDB_PRESHARED_KEY was my chart bug;
        # rename here to match source.
        SPICEDB_TOKEN: "{{ `{{ .spicedb_psk }}` }}"
        {{- if .Values.externalSecrets.adminBootstrap.remoteKey }}
        # Bootstrap admin — drives cmd/admin_bootstrap.go.
        # Idempotent: skipped on subsequent boots when user exists.
        FALCON_ADMIN_EMAIL: "{{ `{{ .admin_email }}` }}"
        FALCON_ADMIN_PASSWORD: "{{ `{{ .admin_password }}` }}"
        {{- end }}
        {{- if .Values.externalSecrets.minioSA.remoteKey }}
        # MinIO scoped-user creds for avatar bucket access.
        # Pre-rotation in 2026-05-07: the chart shipped no MinIO env at
        # all, so falcon-id fell back to viper dev defaults
        # (`hexxlock` / `hexxlock_minio_dev_2024`) and got HTTP 403
        # SignatureDoesNotMatch from prod MinIO. Provisioned by the
        # <gitops-bootstrap-repo> minio-scoped-users CronJob.
        MINIO_ACCESS_KEY: "{{ `{{ .minio_access_key }}` }}"
        MINIO_SECRET_KEY: "{{ `{{ .minio_secret_key }}` }}"
        {{- end }}
        {{- if .Values.externalSecrets.provisionerBootstrap.remoteKey }}
        # Bootstrap OAuth provisioner client — drives
        # cmd/oauth_provisioner_bootstrap.go. Idempotent: skipped on
        # subsequent boots when the iam_oauth_clients row exists with
        # a hash that verifies against this client_secret. Required
        # because Crossplane per-service Jobs (provision-svcclient-*)
        # authenticate as this client; without the row, the entire
        # ServiceClientClaim provisioning chain breaks at the head.
        # See cmd/oauth_provisioner_bootstrap.go header for the full
        # rationale (post-fresh-initdb recovery without operator action).
        FALCON_PROVISIONER_CLIENT_ID: "{{ `{{ .provisioner_client_id }}` }}"
        FALCON_PROVISIONER_CLIENT_SECRET: "{{ `{{ .provisioner_client_secret }}` }}"
        {{- end }}
        {{- if .Values.externalSecrets.serviceClient.remoteKey }}
        # Outbound OAuth client_credentials creds for falcon-id-as-CLIENT
        # to other platform services. Currently consumed by
        # cmd/background.go's tenantprojection bootstrap (REST poll
        # against tenant-management /api/v1/internal/tenants). Provisioned
        # by the XServiceClient Crossplane composition via the
        # `falcon-id-oauth` ServiceClientClaim. ADR 0029 follow-up (G).
        SERVICE_CLIENT_ID: "{{ `{{ .service_client_id }}` }}"
        SERVICE_CLIENT_SECRET: "{{ `{{ .service_client_secret }}` }}"
        {{- end }}
  data:
    # --- Main DB fields ---
    - secretKey: main_host
      remoteRef: {key: {{ .Values.externalSecrets.mainDatabase.remoteKey }}, property: host}
    - secretKey: main_port
      remoteRef: {key: {{ .Values.externalSecrets.mainDatabase.remoteKey }}, property: port}
    - secretKey: main_db
      remoteRef: {key: {{ .Values.externalSecrets.mainDatabase.remoteKey }}, property: db}
    - secretKey: main_user
      remoteRef: {key: {{ .Values.externalSecrets.mainDatabase.remoteKey }}, property: user}
    - secretKey: main_password
      remoteRef: {key: {{ .Values.externalSecrets.mainDatabase.remoteKey }}, property: password}
    # --- Control-plane DB fields ---
    - secretKey: ctl_host
      remoteRef: {key: {{ .Values.externalSecrets.controlDatabase.remoteKey }}, property: host}
    - secretKey: ctl_port
      remoteRef: {key: {{ .Values.externalSecrets.controlDatabase.remoteKey }}, property: port}
    - secretKey: ctl_db
      remoteRef: {key: {{ .Values.externalSecrets.controlDatabase.remoteKey }}, property: db}
    - secretKey: ctl_user
      remoteRef: {key: {{ .Values.externalSecrets.controlDatabase.remoteKey }}, property: user}
    - secretKey: ctl_password
      remoteRef: {key: {{ .Values.externalSecrets.controlDatabase.remoteKey }}, property: password}
    # --- App secrets ---
    - secretKey: jwt_secret
      remoteRef: {key: {{ .Values.externalSecrets.app.remoteKey }}, property: jwt_secret}
    - secretKey: encryption_key
      remoteRef: {key: {{ .Values.externalSecrets.app.remoteKey }}, property: encryption_key}
    - secretKey: token_hash_salt
      remoteRef: {key: {{ .Values.externalSecrets.app.remoteKey }}, property: token_hash_salt}
    - secretKey: internal_api_key
      remoteRef: {key: {{ .Values.externalSecrets.app.remoteKey }}, property: internal_api_key}
    - secretKey: email_hash_key
      remoteRef: {key: {{ .Values.externalSecrets.app.remoteKey }}, property: email_hash_key}
    # --- SpiceDB PSK ---
    - secretKey: spicedb_psk
      remoteRef: {key: {{ .Values.externalSecrets.spicedb.remoteKey }}, property: presharedkey}
    {{- if .Values.externalSecrets.adminBootstrap.remoteKey }}
    # --- Admin bootstrap (optional) ---
    # When set, drives cmd/admin_bootstrap.go to create the initial
    # platform admin on first start. Idempotent: each boot checks for
    # the user via GetByEmail and skips creation when present.
    - secretKey: admin_email
      remoteRef: {key: {{ .Values.externalSecrets.adminBootstrap.remoteKey }}, property: email}
    - secretKey: admin_password
      remoteRef: {key: {{ .Values.externalSecrets.adminBootstrap.remoteKey }}, property: password}
    {{- end }}
    {{- if .Values.externalSecrets.minioSA.remoteKey }}
    # --- MinIO scoped user (optional) ---
    # Vault path holds {access_key, secret_key} written by the
    # <gitops-bootstrap-repo> minio-scoped-users reconciler at
    # `example/data/platform/falcon-id/minio-sa`. The chart-default is
    # empty so non-prod installs without Vault still hydrate the rest
    # of the secret cleanly.
    - secretKey: minio_access_key
      remoteRef: {key: {{ .Values.externalSecrets.minioSA.remoteKey }}, property: access_key}
    - secretKey: minio_secret_key
      remoteRef: {key: {{ .Values.externalSecrets.minioSA.remoteKey }}, property: secret_key}
    {{- end }}
    {{- if .Values.externalSecrets.provisionerBootstrap.remoteKey }}
    # --- OAuth provisioner bootstrap (optional) ---
    # When set, drives cmd/oauth_provisioner_bootstrap.go to ensure the
    # `svc-serviceclient-provisioner` row in iam_oauth_clients on every
    # boot. Idempotent: GetByClientID + secret-hash verify, skip on
    # match. Required for the Crossplane ServiceClientClaim provisioning
    # chain.
    - secretKey: provisioner_client_id
      remoteRef: {key: {{ .Values.externalSecrets.provisionerBootstrap.remoteKey }}, property: client_id}
    - secretKey: provisioner_client_secret
      remoteRef: {key: {{ .Values.externalSecrets.provisionerBootstrap.remoteKey }}, property: client_secret}
    {{- end }}
    {{- if .Values.externalSecrets.serviceClient.remoteKey }}
    # --- Outbound OAuth client_credentials creds (optional) ---
    # Vault path holds {client_id, client_secret} written by the
    # XServiceClient Crossplane composition (`falcon-id-oauth` Claim).
    # Consumed by cmd/background.go's tenantprojection bootstrap to
    # authenticate against tenant-management /api/v1/internal/tenants.
    - secretKey: service_client_id
      remoteRef: {key: {{ .Values.externalSecrets.serviceClient.remoteKey }}, property: client_id}
    - secretKey: service_client_secret
      remoteRef: {key: {{ .Values.externalSecrets.serviceClient.remoteKey }}, property: client_secret}
    {{- end }}
{{- end }}
