{{- if .Values.networkPolicy.enabled }}
---
# NetworkPolicy — L3/L4 default-deny INGRESS for falcon-id with an explicit
# allow-list. This is the network-segmentation baseline (ASVS V13 / CIS
# Kubernetes Benchmark 5.3.2): with policyTypes:[Ingress] and a podSelector
# that matches the falcon-id pods, EVERY inbound connection is denied unless a
# rule below admits it. It complements the Linkerd AuthorizationPolicy (L7
# identity) — defence in depth: even an in-mesh workload that Linkerd would
# reject cannot reach the pod at the packet level unless its namespace is on
# this list.
#
# Egress is deliberately NOT restricted here. A default-deny egress posture
# requires the full outbound dependency map (Postgres, Redis, Vault, SMTP,
# HIBP, upstream OIDC/SAML IdPs, Keystone) and is a separate, higher-risk
# hardening tracked apart from this ingress baseline.
#
# Escape hatch: set networkPolicy.enabled=false to remove this policy.
#
# Namespace matching uses the kubernetes.io/metadata.name label that the
# apiserver auto-applies to every Namespace (NamespaceDefaultLabelName, stable
# since k8s 1.21), so no manual namespace labelling is required. The port is
# referenced by the pod's named container port ("http") so it tracks any future
# containerPort renumbering.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "falcon-id.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon-id.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "falcon-id.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- with .Values.networkPolicy.allowedNamespaces }}
    # In-cluster callers (gateway, BFFs, Prometheus scrape) — HTTP port only.
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.allowProbeCIDRs }}
    # Kubelet liveness/readiness probes — originate from the node with no
    # namespace identity, so they are admitted by pod/node CIDR at L3.
    - from:
        {{- range .Values.networkPolicy.probeCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
