name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the toolchain from go.mod, and take the newest patch release
          # so the standard library carries the latest security fixes.
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      # Tests that need a real Postgres skip themselves when TEST_DATABASE_URL
      # is not set, so this runs without service containers.
      - name: Tests (race detector)
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Uses .golangci.yml from the repository root.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (not pushed)
        run: docker build -t falcon-id:ci .

  quickstart:
    name: quickstart smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same steps as the README quickstart, plus a throwaway provisioner
      # client so a client can be created without an MFA-enrolled admin.
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          FALCON_PROVISIONER_CLIENT_ID=quickstart-provisioner
          FALCON_PROVISIONER_CLIENT_SECRET=quickstart-provisioner-secret-not-real
          EOF

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Discovery document
        run: |
          curl -fsS http://localhost:8010/.well-known/openid-configuration | tee discovery.json
          grep -q '"issuer"' discovery.json

      - name: Create a client
        run: |
          PROV_ID=quickstart-provisioner
          PROV_SECRET=quickstart-provisioner-secret-not-real
          code=$(curl -sS -o token.json -w '%{http_code}' -u "$PROV_ID:$PROV_SECRET" \
            -d grant_type=client_credentials -d scope=admin:oauth-clients \
            http://localhost:8010/oauth/token)
          echo "token endpoint: HTTP $code"; cat token.json; echo
          [ "$code" = 200 ]
          TOKEN=$(python3 -c 'import json; print(json.load(open("token.json"))["access_token"])')
          code=$(curl -sS -o client.json -w '%{http_code}' -X POST http://localhost:8010/api/v1/internal/oauth-clients \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"name":"Quickstart app","grant_types":["authorization_code","refresh_token"],"response_types":["code"],"redirect_uris":["https://app.example.com/callback"],"scopes":["openid","profile","email"],"is_public":true,"require_pkce":true,"logo_url":"https://example.com/logo.png"}')
          echo "create client: HTTP $code"; cat client.json; echo
          [ "$code" = 201 ] || [ "$code" = 200 ]

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
